<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Virtual Photo Album - New York Trip</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Caveat:wght@400;600&family=Playfair+Display:ital,wght@0,400;1,600&display=swap');
  @import url('https://fonts.googleapis.com/css2?family=Dancing+Script:wght@400;700&family=Playfair+Display:ital,wght@0,400;1,600&display=swap');

  * {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
  }

  body {
    background-color: #f0eadd;
    display: flex;
    justify-content: center;
    align-items: center;
    height: 100vh; 
    overflow: hidden; 
    font-family: 'Playfair Display', serif;
  }

  .album-music {
    position: fixed;
    bottom: 20px;
    right: 20px;
    z-index: 1000;
  }

  .album-scene {
    perspective: 1500px;
    width: 900px;
    height: 600px;
    position: relative;
    display: flex;
  }

  .page-right {
    position: absolute;
    right: 0;
    width: 50%;
    height: 100%;
    background-color: #fdfbf7;
    box-shadow: inset 5px 0 15px rgba(0,0,0,0.1), 10px 10px 20px rgba(0,0,0,0.2);
    display: flex;
    flex-direction: column;
    padding: 15px 25px;
    border-radius: 0 8px 8px 0;
    z-index: 1;
    border-left: 2px solid #e3dec9; 
  }

  .leaf {
    position: absolute;
    right: 0; 
    width: 50%;
    height: 100%;
    transform-origin: left center;
    transform-style: preserve-3d;
    transition: transform 1.2s cubic-bezier(0.645, 0.045, 0.355, 1);
    cursor: pointer;
  }

  /* Cập nhật z-index cho 6 trang lật */
  #leaf1 { z-index: 11; }
  #leaf2 { z-index: 10; }
  #leaf3 { z-index: 9; }
  #leaf4 { z-index: 8; }
  #leaf5 { z-index: 7; }
  #leaf6 { z-index: 6; }

  .leaf.flipped {
    transform: rotateY(-180deg);
  }

  .face {
    position: absolute;
    width: 100%;
    height: 100%;
    backface-visibility: hidden;
    border-radius: 0 8px 8px 0;
  }

  .face.front {
    background-color: #fdfbf7;
    display: flex;
    flex-direction: column;
    padding: 15px 25px;
    box-shadow: inset 5px 0 15px rgba(0,0,0,0.1);
    border-left: 2px solid #e3dec9; 
  }

  .face.front.cover {
    background-color: #F8C39F; 
    align-items: center;
    justify-content: center;
    padding: 0;
    box-shadow: inset 5px 0 15px rgba(0,0,0,0.3), 5px 5px 15px rgba(0,0,0,0.4);
    background-image: repeating-linear-gradient(45deg, rgba(255,255,255,0.02) 25%, transparent 25%, transparent 75%, rgba(255,255,255,0.02) 75%, rgba(255,255,255,0.02)), 
                      repeating-linear-gradient(-45deg, rgba(255,255,255,0.02) 25%, transparent 25%, transparent 75%, rgba(255,255,255,0.02) 75%, rgba(255,255,255,0.02));
    background-size: 4px 4px;
    border-left: none;
  }

  .spiral-binding {
    position: absolute;
    left: -15px;
    top: 2%;
    height: 96%;
    width: 30px;
    background: repeating-linear-gradient(
      to bottom,
      transparent,
      transparent 15px,
      #b8860b 15px,
      #8b6508 20px,
      transparent 20px,
      transparent 30px
    );
    z-index: 10;
  }

  .corner {
    position: absolute;
    width: 40px;
    height: 40px;
    border: 3px solid #d4af37;
  }
  .corner-top-right { top: 10px; right: 10px; border-bottom: none; border-left: none; }
  .corner-bottom-right { bottom: 10px; right: 10px; border-top: none; border-left: none; }

  .cover-photo-slot {
    width: 75%;
    aspect-ratio: 4/3;
    background: #000;
    margin-bottom: 25px;
    box-shadow: 0 4px 10px rgba(0,0,0,0.5);
    border: 1px solid rgba(255,255,255,0.1);
    overflow: hidden;
  }
  .cover-photo-slot img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    cursor: pointer;
  }
  
  /* Giảm size chữ */
  .cover-title {
    color: #ffffff; 
    text-shadow: 1px 1px 3px rgba(0,0,0,0.3);
    font-size: 18px; /* Giảm từ 22px xuống 18px cho vừa vặn */
    letter-spacing: 4px; /* Thu hẹp khoảng cách chữ lại một chút */
    text-transform: uppercase;
    text-align: center;
    width: 100%;
    line-height: 1.5; /* Khoảng cách giữa 2 dòng */
  }

  .cover-date-input {
    background: transparent;
    border: none;
    color: #ffffff;
    text-shadow: 1px 1px 3px rgba(0,0,0,0.3);
    font-family: 'Playfair Display', serif;
    font-size: 14px;
    letter-spacing: 3px;
    text-align: center;
    margin-top: 15px;
    outline: none;
    width: 80%;
  }

  .face.back {
    background-color: #fdfbf7;
    transform: rotateY(180deg);
    box-shadow: inset -5px 0 15px rgba(0,0,0,0.1);
    border-radius: 8px 0 0 8px;
    display: flex;
    flex-direction: column;
    padding: 15px 25px;
    border-left: none;
  }

  .travel-tag {
    position: absolute;
    top: 15px;
    right: 25px;
    font-family: 'Caveat', cursive;
    font-size: 22px; /* Thu nhỏ từ 28px */
    color: #C4673B; 
    font-weight: bold;
    z-index: 5;
    pointer-events: none;
  }
  .face.back .travel-tag {
    left: 25px; 
    right: auto;
  }
  
  .layout-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    grid-template-rows: auto auto;
    gap: 10px;
    width: 100%;
    height: 100%;
    margin-top: 25px;
  }

  .top-section, .bottom-section {
    grid-column: 1 / -1;
    display: flex;
    justify-content: space-between;
    align-items: center;
  }

  .photo-frame {
    background: #fff;
    padding: 8px 8px 22px 8px;
    box-shadow: 2px 4px 10px rgba(0,0,0,0.15);
    width: 48%;
    transform: rotate(-2deg);
    transition: transform 0.3s;
  }
  .photo-frame:nth-child(even) {
    transform: rotate(2deg);
  }
  .photo-frame:hover {
    transform: rotate(0deg) scale(1.05);
    z-index: 10;
  }
  
  .photo-frame img {
    width: 100%;
    aspect-ratio: 1/1;
    object-fit: cover;
    background: #e0e0e0;
    cursor: pointer;
  }

  .text-block {
    width: 48%;
    display: flex;
    flex-direction: column;
    justify-content: center;
    padding: 5px;
  }

  /* Giảm size chữ */
  .page-title {
    font-family: 'Caveat', cursive;
    font-size: 20px; 
    color: #333;
    border: none;
    background: transparent;
    outline: none;
    margin-bottom: 5px;
    text-align: center;
  }

  /* Giảm size chữ */
  .scrapbook-text {
    font-family: 'Dancing Script', cursive;
    font-size: 15px; 
    color: #555;
    background: transparent;
    border: none;
    resize: none;
    width: 100%;
    height: 120px;
    outline: none;
    line-height: 1.3; 
    text-align: center;
    overflow: hidden; 
  }

  .photo-frame, .text-block, .cover-date-input, .cover-title {
    cursor: default; 
  }
  .photo-frame img, .cover-photo-slot img {
    cursor: pointer; 
  }

  .modal {
    visibility: hidden;
    opacity: 0;
    position: fixed;
    z-index: 2000;
    left: 0;
    top: 0;
    width: 100%;
    height: 100%;
    background-color: rgba(0, 0, 0, 0.85);
    display: flex;
    justify-content: center;
    align-items: center;
    transition: opacity 0.3s ease, visibility 0.3s ease;
  }
  .modal.active {
    visibility: visible;
    opacity: 1;
  }
  .modal-content {
    max-width: 85%;
    max-height: 85%;
    box-shadow: 0 10px 30px rgba(0, 0, 0, 0.6);
    border: 8px solid #fff;
    border-radius: 4px;
    transform: scale(0.8);
    transition: transform 0.3s ease;
    object-fit: contain;
  }
  .modal.active .modal-content {
    transform: scale(1);
  }
  .close-btn {
    position: absolute;
    top: 20px;
    right: 40px;
    color: #fff;
    font-size: 50px;
    font-weight: bold;
    cursor: pointer;
    transition: color 0.2s;
  }
  .close-btn:hover {
    color: #d4af37;
  }
</style>
</head>

<script>
  let currentZ = 20; 

  document.addEventListener('DOMContentLoaded', () => {
    const music = document.querySelector('.album-music');
    if (music) {
      music.volume = 0.4; 
      music.play().catch(() => {
        const startOnInteraction = () => {
          music.play();
          document.removeEventListener('click', startOnInteraction);
          document.removeEventListener('keydown', startOnInteraction);
        };
        document.addEventListener('click', startOnInteraction);
        document.addEventListener('keydown', startOnInteraction);
      });
    }
  });

  function flipLeaf(leafId, forward, event) {
    if(event) {
      if (
        event.target.closest('.photo-frame') ||
        event.target.closest('.text-block') ||
        event.target.closest('.cover-photo-slot') ||
        ['input', 'textarea', 'img'].includes(event.target.tagName.toLowerCase())
      ) {
        return; 
      }
      event.stopPropagation(); 
    }

    const music = document.querySelector('.album-music');
    if (music && music.paused) {
      music.volume = 0.4;
      music.play().catch(error => console.log("Playback error:", error));
    }

    const leaf = document.getElementById(leafId);
    
    currentZ++;
    leaf.style.zIndex = currentZ;

    if(forward) {
      leaf.classList.add('flipped');
    } else {
      leaf.classList.remove('flipped');
    }
  }

  document.querySelectorAll('.photo-frame img, .cover-photo-slot img').forEach(img => {
    img.addEventListener('click', function(e) {
      e.stopPropagation(); 
      const modal = document.getElementById('imageModal');
      const modalImg = document.getElementById('modalImg');
      modalImg.src = this.src;
      modal.classList.add('active');
    });
  });

  function closeModal() {
    document.getElementById('imageModal').classList.remove('active');
  }
</script>

</body>
</html>
